version: '3.8'

services:
  # Base de Datos
  db:
    image: postgres:16-alpine
    container_name: fmat_archive_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./database/pgdata:/var/lib/postgresql/data
    networks:
      - fmat_net

  # Interfaz Visual (Adminer)
  adminer:
    image: adminer
    container_name: fmat_archive_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - fmat_net

networks:
  fmat_net:
    driver: bridge